<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="350.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Pareto Frontier: Accuracy vs On-Chip BRAM Consumption</text>
  <line x1="60" y1="50" x2="60" y2="300" stroke="#64748b" stroke-width="2" />
  <line x1="60" y1="300" x2="650" y2="300" stroke="#64748b" stroke-width="2" />
  
  <text x="25" y="175" text-anchor="middle" transform="rotate(-90, 25, 175)" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Top-1 Accuracy (%)</text>
  <text x="355" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">BRAM 18K Blocks Consumed</text>

  <!-- Budget threshold line at 160 BRAM -->
  <line x1="500" y1="50" x2="500" y2="300" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4" />
  <text x="495" y="65" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#ef4444" font-weight="bold">BRAM Budget Ceiling (160 blocks)</text>

  <!-- Uniform INT8: (182 BRAM, 84.12% Acc) -> Violates BRAM budget ceiling -->
  <circle cx="610" cy="80" r="7" fill="#64748b" />
  <text x="610" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b">Uniform INT8 (182 blk, 84.12%)</text>
  <text x="610" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Exceeds Budget!</text>

  <!-- Pareto curve line -->
  <path d="M 610 80 L 460 110 L 370 135 L 310 155 L 260 178" fill="none" stroke="#2563eb" stroke-width="3" />

  <!-- Intermediate Points -->
  <circle cx="460" cy="110" r="6" fill="#2563eb" />
  <text x="460" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Step 1 (154 blk)</text>

  <circle cx="370" cy="135" r="6" fill="#2563eb" />
  <text x="370" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Step 2 (138 blk)</text>

  <circle cx="310" cy="155" r="6" fill="#2563eb" />
  <text x="310" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Step 3 (128 blk)</text>

  <!-- Final Selected Point -->
  <circle cx="260" cy="178" r="8" fill="#10b981" stroke="#047857" stroke-width="2" />
  <text x="260" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#047857">Selected Mixed-Precision</text>
  <text x="260" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#047857">121 blk, 82.73% (-33.5% BRAM)</text>

  <!-- Uniform INT4 (91 BRAM, ~72% Acc) -> Below accuracy tolerance -->
  <circle cx="100" cy="270" r="6" fill="#94a3b8" />
  <text x="100" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Uniform INT4 (91 blk, 72.4%)</text>
  <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Accuracy Collapse</text>
</svg>
