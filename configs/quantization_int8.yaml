# Uniform INT8 Quantization Configuration
quantization:
  strategy: "uniform_int8"
  default_weight_bit_width: 8
  default_act_bit_width: 8
  default_bias_bit_width: 32
  
  # Quantization specifics
  weight_narrow_range: true       # [-127, 127] symmetric
  weight_scaling_per_output_channel: true  # per-channel scaling for weights
  act_scaling_per_channel: false  # per-tensor scaling for activations
  act_signed: false              # unsigned [0, 255] post-ReLU
  
  # Layer-specific overrides (all 8 at INT8 baseline)
  layer_precisions:
    conv0: {weight_bits: 8, act_bits: 8}
    conv1: {weight_bits: 8, act_bits: 8}
    conv2: {weight_bits: 8, act_bits: 8}
    conv3: {weight_bits: 8, act_bits: 8}
    conv4: {weight_bits: 8, act_bits: 8}
    conv5: {weight_bits: 8, act_bits: 8}
    fc0:   {weight_bits: 8, act_bits: 8}
    fc1:   {weight_bits: 8, act_bits: 8}

qat_training:
  epochs: 15
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.00001
  scheduler: "cosine"
  batch_size: 128
  seed: 42
